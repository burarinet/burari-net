[build]
  base = "site"
  command = "npm run build"
  publish = "dist/client"

[build.environment]
  NODE_VERSION = "22"
  NETLIFY_NEXT_PLUGIN_SKIP = "true"

[[redirects]]
  from = "/index.php"
  to = "/"
  status = 301

[[redirects]]
  from = "/index.php/*"
  to = "/:splat"
  status = 301

[[redirects]]
  from = "/!trash/sitemap"
  to = "/sitemap/"
  status = 301

# Netlify parses this static form definition while building. Visitors do not
# need to access it after deployment.
[[redirects]]
  from = "/__forms.html"
  to = "/404.html"
  status = 404

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
